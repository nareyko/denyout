# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: denyout

before:
  hooks:
    - go mod tidy

builds:
  - id: denyout-cli
    main: ./cmd/denyout-cli
    binary: denyout-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "denyout-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/install-windows.md
      - docs/10-security-boundaries.md
      - scripts/Start-DenyOut.cmd

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

# Keyless Sigstore signature over SHA256SUMS (GitHub Actions OIDC identity, no key to leak).
# install.sh verifies it with cosign (DENYOUT_VERIFY_SIG=require to make it mandatory).
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: nareyko
    name: denyout
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

snapshot:
  version_template: "{{ .Version }}-next"

announce:
  skip: true
