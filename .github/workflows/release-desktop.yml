# Builds denyout-desktop (Wails + CGO) and attaches archives to the same tag release.
name: release-desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      upload_tag:
        description: "Existing release tag to attach assets (e.g. v0.3.0). Leave empty on tag pushes."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            tags: "wails,production,webkit2_41"
            deps: "libgtk-3-dev libwebkit2gtk-4.1-dev"
          - os: windows-latest
            goos: windows
            goarch: amd64
            tags: "wails,production"
            deps: ""
          # macOS: best-effort; tray+Wails main-thread coexistence is fragile.
          # macos-14 retired Nov 2026 (macos-14-arm64-us-default unsupported) -> pin macos-15 arm64.
          - os: macos-15
            goos: darwin
            goarch: arm64
            tags: "wails,production"
            deps: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.upload_tag }}" ]; then
            echo "tag=${{ github.event.inputs.upload_tag }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cmd/denyout-desktop/frontend/package-lock.json
      - name: Install Linux WebKit
        if: matrix.deps != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ${{ matrix.deps }}
      - name: Build frontend
        working-directory: cmd/denyout-desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Build denyout-desktop
        env:
          CGO_ENABLED: "1"
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -e
          if [ -z "${TAG}" ]; then
            TAG="dev"
          fi
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUT="denyout-desktop_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          go build -tags "${{ matrix.tags }}" -ldflags "-s -w -X main.version=${TAG}" \
            -o "$OUT" ./cmd/denyout-desktop
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # tar.gz keeps install.sh naming consistent across platforms
            tar -czf "dist/denyout-desktop_${TAG}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" "$OUT"
          else
            tar -czf "dist/${OUT}.tar.gz" "$OUT"
          fi
        shell: bash
      - name: Upload release asset
        if: steps.meta.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
