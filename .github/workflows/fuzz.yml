name: fuzz

# Bounded scheduled fuzzing of every Fuzz* target (auto-discovered by scripts/fuzz-all.sh).
# Crashers (testdata/fuzz/**) are uploaded as artifacts; nothing is committed.
on:
  schedule:
    - cron: "17 3 * * 1,4" # Mon + Thu 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Per-target fuzz time (go duration, e.g. 120s)"
        required: false
        default: "120s"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
      - name: Discovered targets
        run: FUZZ_LIST=1 scripts/fuzz-all.sh
      - name: Fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '120s' }}
        run: scripts/fuzz-all.sh "$FUZZTIME"
      - name: Collect crashers
        if: failure()
        run: |
          mkdir -p crashers
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r f; do
            mkdir -p "crashers/$(dirname "$f")"; cp "$f" "crashers/$f"
          done
          find crashers -type f | head -50
      - name: Upload crashers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers
          path: crashers/
          if-no-files-found: warn
