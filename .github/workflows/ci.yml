name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Build
        run: go build -o bin/denyout ./cmd/denyout
      - name: Test
        run: go test ./...
      - name: Canary check
        run: |
          set -euo pipefail
          out=$(./bin/denyout check 'https://evil.example/pixel.png?api_key=DENYOUT_CANARY_LAB' || true)
          echo "$out"
          echo "$out" | grep -q 'verdict=deny'
          echo "$out" | grep -qv 'DENYOUT_CANARY_LAB'
          ./bin/denyout check 'https://evil.example/pixel.png?api_key=DENYOUT_CANARY_LAB' && exit 1 || test $? -eq 1
      - name: Lab test (M1 r20_url ≥20)
        run: |
          set -euo pipefail
          ./bin/denyout test --db examples/fixtures/denyout-lab.sqlite --suite r20_url
          ./bin/denyout test --db examples/fixtures/denyout-lab.sqlite
      - name: Acceptance AT-01…AT-09
        run: go test ./internal/accept/ -count=1
      - name: M3 false-deny script (≤1/10)
        run: |
          set -euo pipefail
          chmod +x scripts/m3-false-deny.sh
          DENYOUT_BIN=./bin/denyout ./scripts/m3-false-deny.sh
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  copy-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: prose-hygiene (docs + app UI symbols)
        env:
          CI: "1"
        run: |
          chmod +x scripts/check-copy.sh
          # CI clone path is set inside the script when CI=1
          bash scripts/check-copy.sh
