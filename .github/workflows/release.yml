name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # keyless cosign signing (Sigstore OIDC)
  actions: write # dispatch m4-smoke after publishing (events from GITHUB_TOKEN do not trigger `release: published`)

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.27.4"
      - uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0
        with:
          # cosign 2.4 (installer default) cannot verify the sigstore bundle that current goreleaser
          # releases ship: v0.4.14-rc1 failed with "bundle does not contain cert". Pin a newer 2.x.
          cosign-release: "v2.6.5"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A release published with GITHUB_TOKEN does not fire m4-smoke's `release` trigger,
      # but an explicit workflow_dispatch is allowed. Evidence for M4 on every tag.
      - name: Dispatch m4-smoke for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run m4-smoke.yml --repo "$GITHUB_REPOSITORY" -f tag="$GITHUB_REF_NAME"
