name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.11"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-site:
    needs: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Trigger denyout-web site deploy
        env:
          GH_TOKEN: ${{ secrets.DENYOUT_WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DENYOUT_WEB_DISPATCH_TOKEN unset; skip site dispatch (use workflow_dispatch on denyout-web)"
            exit 0
          fi
          gh api repos/nareyko/denyout-web/dispatches \
            -f event_type=denyout-release \
            -f "client_payload[tag]=${GITHUB_REF_NAME}"
