version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      golang-x:
        patterns: ["golang.org/x/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # cosign 3.x requires --bundle (no --output-signature/--certificate); release signing and
      # install.sh verification need a coordinated migration first.
      - dependency-name: "sigstore/cosign-installer"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: "/cmd/denyout/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
