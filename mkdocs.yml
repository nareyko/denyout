site_name: DenyOut docs
site_url: https://denyout.com/reference/
site_description: DenyOut product specification and design docs
repo_url: https://github.com/nareyko/denyout
repo_name: nareyko/denyout
docs_dir: docs
site_dir: site-reference
theme:
  name: material
  palette:
    primary: black
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - search.suggest
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - admonition
  - pymdownx.superfences
  - pymdownx.details
