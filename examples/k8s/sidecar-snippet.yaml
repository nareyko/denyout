# Illustrative snippet — not a full Helm chart.
# Pair with networkpolicy.yaml so the agent cannot bypass DenyOut.
apiVersion: v1
kind: ConfigMap
metadata:
  name: denyout-config
data:
  denyout.yaml: |
    apiVersion: denyout/v1
    kind: Config
    mode: enforce
    preset: models
    tls:
      mode: intercept
      session_ca: true
    listen:
      host: 127.0.0.1
      port: 8080
    scanners:
      canaries:
        - "DENYOUT_CANARY_"
    audit:
      stdout: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sample-agent
  template:
    metadata:
      labels:
        app: sample-agent
    spec:
      containers:
        - name: agent
          image: example/agent:latest
          env:
            - name: HTTP_PROXY
              value: http://127.0.0.1:8080
            - name: HTTPS_PROXY
              value: http://127.0.0.1:8080
            - name: NO_PROXY
              value: localhost,127.0.0.1
            # Mount DenyOut CA into SSL_CERT_FILE when using intercept
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
        - name: denyout
          image: denyout/denyout:0.1.0 # planned
          args: ["serve", "-c", "/config/denyout.yaml"]
          ports:
            - containerPort: 8080
              name: proxy
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: denyout-config
