suite: browse_compat
cases:
  - id: browse-01-example
    url: "https://example.com/"
    mode: blocklist
    preset: none
    expect: allow
  - id: browse-02-secret
    url: "https://example.com/x?api_key=sk-denyouttest000000000000000"
    mode: blocklist
    preset: none
    expect: deny
    reasons: [secret_in_url]
  - id: browse-03-pastebin
    url: "https://pastebin.com/"
    mode: blocklist
    preset: none
    expect: deny
    reasons: [host_denied]
  - id: browse-04-anthropic
    url: "https://api.anthropic.com/"
    mode: blocklist
    preset: none
    expect: allow
